services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: wbot_test
      POSTGRES_DB: wbot_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?test password required}
    ports:
      - "127.0.0.1:15432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wbot_test -d wbot_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  redis:
    image: redis:8-alpine
    ports:
      - "127.0.0.1:16379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 20
