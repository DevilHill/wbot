# Install only after rpa.marswei.fun resolves to this server and its certificate exists.
# The OC backend continues listening on loopback; no admin port is exposed directly.
server {
    listen 80;
    listen [::]:80;
    server_name rpa.marswei.fun;
    location /.well-known/acme-challenge/ {
        root /var/www/wbot-acme;
    }
    location / {
        return 301 https://rpa.marswei.fun$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rpa.marswei.fun;
    ssl_certificate /etc/letsencrypt/live/rpa.marswei.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rpa.marswei.fun/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 132m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    location ^~ /api/agent/ {
        client_max_body_size 8m;
        proxy_pass http://127.0.0.1:18893;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }

    location / {
        # OC provides its own login page, cookie sessions and per-route role checks.
        auth_basic off;
        # Reject foreign browser origins before rewriting the trusted upstream origin.
        if ($http_origin !~ "^(https://rpa\.marswei\.fun)?$") { return 403; }
        proxy_pass http://127.0.0.1:18892;
        proxy_set_header Host 127.0.0.1:18892;
        proxy_set_header Origin http://127.0.0.1:18892;
        proxy_set_header Authorization "";
        proxy_set_header X-WBot-Proxy "1";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }
}
